[project]
name = "pypi-tea"
version = "26.10.0"
description = "TEA Server for PyPI Package SBOMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "cyclonedx-python-lib[json-validation]>=11.6.0",
    "fastapi>=0.115",
    "anyio>=4.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "libtea>=0.4.0",
    "packaging>=24.0",
    "packageurl-python>=0.15",
    "pydantic-settings>=2.13.1",
    "pypi-attestations>=0.0.13",
    "sentry-sdk[fastapi]>=2.0",
    "spdx-tools>=0.8.3",
    "uvicorn[standard]>=0.30",
    "pygments>=2.20.0",
    "cryptography>=46.0.6",
    "requests>=2.33.1",
    "gunicorn>=23.0",
    "uvicorn-worker>=0.3",
]

[project.optional-dependencies]
# Only needed for `pypi-tea-refresh --import-redis` (migrating from a 0.x Redis deployment).
import-redis = ["redis>=5.0"]

[project.scripts]
pypi-tea-serve = "pypi_tea.serve:cli"
pypi-tea-refresh = "pypi_tea.refresh:cli"
pypi-tea-worker = "pypi_tea.worker:cli"

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pypi_tea"]
sbom-files = ["pypi-tea.cdx.json"]

[tool.hatch.build.targets.sdist]
include = ["src/pypi_tea", "pypi-tea.cdx.json", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    "types-requests>=2.32.4.20260107",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "B008",  # Depends() in function defaults is the FastAPI pattern
]

[tool.ruff.lint.isort]
known-first-party = ["pypi_tea"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["sentry_sdk", "pypi_attestations", "sigstore", "redis", "gunicorn.*", "uvicorn_worker"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# gunicorn ships no type information, so its classes are Any to mypy.
module = ["pypi_tea.serve"]
disallow_subclassing_any = false
